<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROKT Support — Customer Support</title><style>:root{--purple:#7257ff;--purple2:#a895ff;--blue:#a9d9ff;--ink:#171820;--muted:#727786;--line:#e9eaf0;--white:#fff;--bg:#f5f7fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8f9ff 0%,#eef7ff 48%,#f6f1ff 100%);color:var(--ink);font:14px Inter,system-ui,-apple-system,sans-serif}.app{display:grid;grid-template-columns:225px 325px minmax(430px,1fr) 270px;height:100vh;overflow:hidden}.side{background:linear-gradient(160deg,#171820,#28213d 60%,#233448);color:#fff;padding:20px 15px;display:flex;flex-direction:column}.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 30px;font-weight:850;letter-spacing:-.02em}.logoMark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#8d79ff,#9fd8ff);display:grid;place-items:center;color:#171820;font-weight:900}.a3{font-size:9px;letter-spacing:.12em;margin-left:2px;padding:4px 6px;border:1px solid #ffffff55;border-radius:5px;color:#cbd9ff}.nav{display:grid;gap:5px}.nav a{color:#b8bac5;text-decoration:none;padding:11px 12px;border-radius:9px}.nav a:hover,.nav a.active{background:#ffffff12;color:#fff}.nav .num{float:right;background:#ffffff18;border-radius:99px;padding:2px 7px;font-size:10px}.user{margin-top:auto;border-top:1px solid #ffffff18;padding:14px 7px;display:flex;gap:9px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e9e5ff;color:#5e4ae5;font-weight:800;flex:none}.user small{color:#9699a6;display:block}.inbox{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.head{padding:21px 18px 13px}.headrow{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:20px}.new{border:0;background:linear-gradient(135deg,var(--purple),#8d77ff);color:#fff;border-radius ign-self:flex-end;flex-direction:row-reverse}.bubble{padding:11px 14px;border-radius:13px;background:#fff;border:1px solid var(--line);line-height:1.45;box-shadow:0 4px 18px #4d4b6510}.agent .bubble{background:linear-gradient(135deg,#7358ff,#8e79ff);color:#fff;border-color:transparent}.msgmeta{font-size:9px;color:#999da8;margin-top:4px}.agent .msgmeta{text-align:right}.composer{background:#fff;border-top:1px solid var(--line);padding:13px 22px}.composebox{display:flex;gap:8px;border:1px solid #dddfe6;border-radius:10px;padding:8px;background:#fff}.composebox textarea{flex:1;border:0;outline:0;resize:none;font:inherit;min-height:34px}.send{border:0;background:var(--purple);color:#fff;border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer}.details{background:#fff;border-left:1px solid var(--line);overflow:auto}.detailHead{padding:21px 18px;border-bottom:1px solid var(--line)}.detailHead h3{margin:0 0 3px}.muted{color:var(--muted);font-size:11px}.detailSection{padding:16px 18px;border-bottom:1px solid var(--line)}.title{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:#969aa5;font-weight:800;margin-bottom:11px}.detailRow{display:flex;justify-content:space-between;margin:10px 0;gap:10px}.detailRow span{color:var(--muted)}.mapBtn{width:100%;border:1px solid #ddd8ff;background:#f4f1ff;color:#5d49dc;border-radius:8px;padding:9px;font-weight:700;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#10111a88;z-index:5;place-items:center}.modal.show{display:grid}.modalbox{width:min(680px,90vw);background:#fff;border-radius:16px;padding:22px;box-shadow:0 30px 80px #1114}.modalbox h3{margin-top:0}.node{padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0;background:linear-gradient(90deg,#faf9ff,#f2faff)}.node b{color:#5d49dc}.close{float:right;border:0;background:#f1f1f4;border-radius:7px;padding:6px 9px;cursor:pointer}@media(max-width:1050px){.app{grid-template-columns:70px 300px minmax(400px,1fr)}.side{padding:18 ()});const maps={Billing:['Identify the transaction','Check invoice and payment history','Confirm duplicate / incorrect charge','Apply billing policy','Issue refund or escalate','Confirm resolution with customer'],Technical:['Identify product and environment','Check incident status','Collect error details','Review known fixes','Escalate if required','Confirm service restoration'],Account:['Verify account','Identify requested change','Check permissions','Apply account policy','Confirm update','Close request'],Access:['Verify identity','Check access state','Initiate secure recovery','Confirm successful login','Document resolution'],Subscription:['Check current plan','Review renewal terms','Confirm requested action','Apply subscription policy','Confirm effective date'],Booking:['Verify reservation','Check modification policy','Update reservation','Confirm new details'],Delivery:['Check order status','Review carrier information','Confirm delivery window','Escalate if SLA is exceeded'],Order:['Verify order','Check fulfillment status','Confirm requested action','Update customer'],Returns:['Verify order eligibility','Check return policy','Generate return instructions','Confirm next step'],Payments:['Check transaction status','Review payment method','Confirm authorization result','Escalate if unresolved'],Product:['Identify product','Check knowledge base','Provide verified information','Confirm customer needs']} ;$('#mapBtn').onclick=()=>{const c=clients[selected],steps=maps[c[3]]||maps.Account;$('#mapTitle').textContent=c[3]+' · Resolution map';$('#map').innerHTML=steps.map((x,i)=>'<div class="node"><b>'+String(i+1).padStart(2,'0')+'</b> · '+x+'</div>').join('');$('#modal').classList.add('show')};$('#close').onclick=()=>$('#modal').classList.remove('show');render();load();</script></body></html>
