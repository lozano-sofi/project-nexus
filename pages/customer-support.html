<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROKT Support A3</title><style>:root{--p:#7257ff;--b:#a9d9ff;--ink:#171820;--muted:#737887;--line:#e8e9ef}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:linear-gradient(135deg,#f8f9ff,#eef7ff,#f6f1ff);color:var(--ink);font:14px Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:225px 325px minmax(430px,1fr) 270px;height:100dvh;min-height:0;overflow:hidden}.side{background:linear-gradient(160deg,#171820,#28213d 60%,#233448);color:#fff;padding:20px 15px;display:flex;flex-direction:column}.logo{display:flex;align-items:center;gap:8px;padding:4px 8px 30px;font-weight:850}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#8d79ff,#9fd8ff);display:grid;place-items:center;color:#171820;font-weight:900}.a3{font-size:9px;padding:4px 6px;border:1px solid #ffffff55;border-radius:5px;color:#cbd9ff}.nav{display:grid;gap:5px}.nav a{color:#b8bac5;text-decoration:none;padding:11px 12px;border-radius:9px}.nav a:hover,.nav a.active{background:#ffffff12;color:#fff}.user{margin-top:auto;border-top:1px solid #ffffff18;padding:14px 7px;display:flex;gap:9px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e9e5ff;color:#5e4ae5;font-weight:800;flex:none}.user small{display:block;color:#9699a6}.inbox{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}.head{padding:21px 18px 13px;flex:0 0 auto}.headrow{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:20px}.new{border:0;background:linear-gradient(135deg,var(--p),#8d77ff);color:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.search{margin-top:14px;background:#f5f6f9;border:1px solid #eeeef2;border-radius:9px;padding:9px 10px;display:flex;color:var(--muted)}.search input{border:0;background:transparent;outline:0;width:100%;font:inherit}.list{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1}.empty{padding:45px 25px;text-align:center;color:#969aa5}.conversation{padding:14px 18px;border-top:1px solid #f0f0f3;cursor:pointer;position:relative}.conversation.selected{background:linear-gradient(90deg,#faf9ff,#f8fbff)}.conversation.selected:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--p),var(--b))}.row{display:flex;gap:10px}.meta{min-width:0;flex:1}.preview{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;margin-top:4px}.company{font-size:10px;color:#5d4de0;margin-top:6px;font-weight:700}.badge{font-size:9px;border-radius:99px;padding:3px 7px;background:#e9f9f2;color:#25825e;display:inline-block;margin-top:6px}.chat{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;background:#fafbfe}.chathead{height:75px;flex:0 0 75px;background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between}.customer{display:flex;gap:10px;align-items:center}.customer strong{display:block}.online{font-size:10px;color:#27976b;margin-top:3px}.pill{background:#eef5ff;color:#4f5d85;border-radius:8px;padding:7px 9px;font-size:11px}.messages{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:26px 8%;display:flex;flex-direction:column;gap:13px;scroll-behavior:smooth}.msg{max-width:74%}.msg.agent{align-self:flex-end;text-align:right}.bubble{display:inline-block;padding:11px 14px;border-radius:13px;background:#fff;border:1px solid var(--line);line-height:1.45;box-shadow:0 4px 18px #4d4b6510;text-align:left}.agent .bubble{background:linear-gradient(135deg,#7358ff,#8e79ff);color:#fff;border-color:transparent}.metaMsg{font-size:9px;color:#999da8;margin-top:4px}.composer{background:#fff;border-top:1px solid var(--line);padding:13px 22px;flex:0 0 auto;position:relative;z-index:2}.compose{display:flex;gap:8px;border:1px solid #dddfe6;border-radius:10px;padding:8px;background:#fff}.compose textarea{flex:1;border:0;outline:0;resize:none;font:inherit;min-height:34px;max-height:110px}.send{border:0;background:var(--p);color:#fff;border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer}.details{background:#fff;border-left:1px solid var(--line);overflow:auto;min-height:0}.detailHead{padding:21px 18px;border-bottom:1px solid var(--line)}.detailHead h3{margin:0 0 3px}.muted{color:var(--muted);font-size:11px}.section{padding:16px 18px;border-bottom:1px solid var(--line)}.title{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:#969aa5;font-weight:800;margin-bottom:11px}.rowD{display:flex;justify-content:space-between;margin:10px 0;gap:10px}.rowD span{color:var(--muted)}.mapBtn{width:100%;border:1px solid #ddd8ff;background:#f4f1ff;color:#5d49dc;border-radius:8px;padding:9px;font-weight:700;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#10111a88;z-index:5;place-items:center}.modal.show{display:grid}.modalbox{width:min(680px,90vw);max-height:85vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.close{float:right;border:0;background:#f1f1f4;border-radius:7px;padding:6px 9px;cursor:pointer}.node{padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0;background:linear-gradient(90deg,#faf9ff,#f2faff)}.node b{color:#5d49dc}@media(max-width:1050px){.app{grid-template-columns:70px 300px minmax(400px,1fr)}.side{padding:18px 8px}.logo span,.nav span,.user .utext{display:none}.details{display:none}}@media(max-width:700px){.app{grid-template-columns:1fr}.side,.inbox{display:none}.messages{padding:20px}.msg{max-width:88%}}</style></head><body><div class="app"><aside class="side"><div class="logo"><div class="mark">R</div><span>ROKT SUPPORT</span><i class="a3">A3</i></div><nav class="nav"><a class="active" href="customer-support.html">▣ <span>Inbox</span></a><a href="tickets.html">◫ <span>Tickets</span></a><a href="customers.html">♙ <span>Customer</span></a><a href="analytical.html">◴ <span>Analytical</span></a></nav><div class="user"><div class="avatar">SL</div><div class="utext"><b>Sofia Lozano</b><small>bc4h67</small></div></div></aside><section class="inbox"><div class="head"><div class="headrow"><h2>Inbox</h2><button class="new" id="new">+ New</button></div><label class="search">⌕ <input id="search" placeholder="Search customers..."></label></div><div class="list" id="list"><div class="empty">No active conversations.<br><br>Click <b>+ New</b> to open a customer request.</div></div></section><main class="chat"><header class="chathead"><div class="customer"><div class="avatar" id="avatar">—</div><div><strong id="name">Select a customer</strong><div class="online" id="online"></div></div></div><div class="pill" id="company"></div></header><div class="messages" id="messages"></div><form class="composer" id="form"><div class="compose"><textarea id="input" placeholder="Write a reply..."></textarea><button class="send">Send</button></div></form></main><aside class="details"><div class="detailHead"><h3>Conversation</h3><div class="muted" id="sideName">No active ticket</div></div><div class="section"><div class="title">Ticket</div><div class="rowD"><span>ID</span><b id="ticket">—</b></div><div class="rowD"><span>Status</span><b id="status">—</b></div></div><div class="section"><div class="title">Connection</div><div class="rowD"><span>Company</span><b id="sideCompany">—</b></div><div class="rowD"><span>Customer</span><b id="sideCustomer">—</b></div></div><div class="section"><div class="title">Category</div><b id="category">—</b></div><div class="section"><div class="title">Map</div><button class="mapBtn" id="mapBtn">Open resolution map</button></div></aside></div><div class="modal" id="modal"><div class="modalbox"><button class="close" id="close">×</button><h3 id="mapTitle">Resolution map</h3><div id="map"></div></div></div><script>const clients=[['Elena Rossi','Italy','Netflix','Billing','High','ER','I was charged twice for my subscription this month.'],['Arthur Bennett','United Kingdom','Amazon','Account','Open','AB','I need to change the company address on our account.'],['Sophie Laurent','France','Airbnb','Technical','High','SL','Our export keeps timing out and we need the report today.'],['Matteo Bianchi','Italy','Samsung','Access','Open','MB','I cannot sign in after trying to reset my password.'],['Charlotte Müller','Germany','Adobe','Subscription','Open','CM','I have a question about our renewal and cancellation options.'],['Liam O’Connor','Ireland','Microsoft','Technical','High','LO','The desktop application crashes after the latest update.'],['Isabella Romano','Italy','Spotify','Billing','Open','IR','There is an unexpected charge on our monthly plan.'],['Hugo Martin','France','Booking.com','Booking','Open','HM','I need to correct the details of a reservation.'],['Amelia Smith','United Kingdom','Apple','Account','Open','AS','I need help changing information on my account.'],['Lukas Weber','Germany','BMW','Technical','High','LW','The connected service is not syncing correctly.'],['Inês Duarte','Portugal','Zalando','Delivery','Open','ID','The order delivery status has not changed.'],['Freja Nielsen','Denmark','LEGO','Order','Open','FN','My order arrived with a missing item.'],['Sofia Papadopoulos','Greece','Revolut','Payments','High','SP','My card payment was declined unexpectedly.'],['Noah Dubois','France','Decathlon','Returns','Open','ND','I would like to arrange a product return.'],['Emma Johansson','Sweden','IKEA','Delivery','Open','EJ','I need to change my delivery window.'],['Oliver Brown','United Kingdom','Canva','Account','Open','OB','Workspace permissions need to be changed.'],['Clara Rossi','Italy','Gucci','Order','High','CR','My order status has not updated.'],['Maximilian Fischer','Germany','SAP','Technical','Open','MF','The integration endpoint is returning an error.'],['Aoife Murphy','Ireland','HubSpot','Account','Open','AM','A user needs their access changed.'],['Camille Bernard','France','L’Oréal','Product','Open','CB','I need verified product information.'],['João Pereira','Portugal','Farfetch','Returns','Open','JP','The return label was not generated.'],['Nora Hansen','Norway','Spotify','Billing','Open','NH','The invoice details are incorrect.'],['Elias Andersson','Sweden','Volvo','Technical','High','EA','The vehicle app connection is unavailable.'],['Anna Kowalska','Poland','Booking.com','Booking','Open','AK','The reservation date needs correction.'],['Mia Rossi','Switzerland','Nestlé','Product','Open','MR','I need information about a product.'],['Felix Schneider','Austria','Red Bull','Billing','Open','FS','The invoice payment appears duplicated.'],['Laura Sánchez','Spain','Inditex','Order','Open','LS','The order arrived later than expected.'],['Thomas Evans','United Kingdom','HSBC','Payments','High','TE','My transfer is still pending.'],['Elise Martin','France','Louis Vuitton','Returns','Open','EM','I need assistance with a return.'],['Daniel Novak','Czech Republic','Siemens','Technical','Open','DN','The device integration needs troubleshooting.']];const replies={Billing:['I understand. Could you confirm the date and amount of the charge?','Thank you. I am checking the billing details now.','Could you confirm which transaction you do not recognize?'],Account:['Of course. Could you confirm the account details you want changed?','Thanks. I am checking the account permissions now.','I just need to verify the requested change.'],Technical:['Thanks for the details. What device and version are you using?','Does the issue happen every time?','I am checking the available troubleshooting steps.'],Access:['What error do you see when signing in?','Have you already received the password reset email?','I will guide you through the secure recovery steps.'],Subscription:['Could you confirm the plan you are currently on?','I am checking the subscription terms now.','I will clarify the available options for you.'],Booking:['Could you confirm the reservation reference?','I am checking the modification rules for this booking.','Let me verify what can be changed.'],Delivery:['Could you confirm the order reference?','I am checking the latest delivery status.','I will review the carrier information.'],Order:['Could you confirm the order reference?','I am checking the fulfillment status now.','Let me verify the latest update.'],Returns:['Could you confirm the order reference?','I am checking the return eligibility.','I will verify the return instructions.'],Payments:['Could you confirm the transaction time?','I am checking the payment authorization status.','I will review the payment details carefully.'],Product:['Could you tell me which product you mean?','I am checking the verified product information.','I will make sure the details are accurate.']};const resolution={Billing:['refund','refunded','duplicate','credit','chargeback'],Account:['updated','update','changed','change','address'],Technical:['fixed','resolved','solution','restart','reinstall','escalated'],Access:['reset','password','login','access','signed'],Subscription:['cancel','cancelled','renew','renewal','plan'],Booking:['updated','changed','reservation','booking'],Delivery:['delivered','tracking','delivery','carrier','reschedule'],Order:['replacement','shipped','status','order'],Returns:['return','label','refund'],Payments:['approved','processed','payment','transfer'],Product:['information','details','product']};let active=[],current=null,msgCount=0;const $=s=>document.querySelector(s);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function scrollBottom(){requestAnimationFrame(()=>{$('#messages').scrollTop=$('#messages').scrollHeight})}function add(w,text){msgCount++;const d=document.createElement('div');d.className='msg '+(w==='agent'?'agent':'');d.innerHTML='<div><div class="bubble">'+esc(text)+'</div><div class="metaMsg">'+(w==='agent'?'Sofia Lozano':clients[current][0])+'</div></div>';$('#messages').appendChild(d);scrollBottom()}function render(){const q=$('#search').value.toLowerCase();const list=$('#list');list.innerHTML='';const shown=active.filter(i=>clients[i].join(' ').toLowerCase().includes(q));if(!shown.length){list.innerHTML='<div class="empty">No active conversations.<br><br>Click <b>+ New</b> to open a customer request.</div>';return}shown.forEach(i=>{const c=clients[i],d=document.createElement('div');d.className='conversation '+(i===current?'selected':'');d.innerHTML='<div class="row"><div class="avatar">'+c[5]+'</div><div class="meta"><b>'+c[0]+'</b><div class="preview">'+c[6]+'</div><div class="company">'+c[2]+'</div><span class="badge">'+c[4]+'</span></div></div>';d.onclick=()=>open(i);list.appendChild(d)})}function reset(){current=null;$('#avatar').textContent='—';$('#name').textContent='Select a customer';$('#online').textContent='';$('#company').textContent='';$('#messages').innerHTML='';$('#sideName').textContent='No active ticket';$('#ticket').textContent='—';$('#status').textContent='—';$('#sideCompany').textContent='—';$('#sideCustomer').textContent='—';$('#category').textContent='—'}function open(i){current=i;msgCount=0;const c=clients[i];$('#avatar').textContent=c[5];$('#name').textContent=c[0];$('#online').textContent='● Connected';$('#company').textContent=c[2]+' · Customer';$('#sideName').textContent=c[0];$('#ticket').textContent='RK-'+(10428+i);$('#status').textContent='Open';$('#sideCompany').textContent=c[2];$('#sideCustomer').textContent=c[0];$('#category').textContent=c[3];$('#messages').innerHTML='';add('customer',c[6]);render()}function finish(){if(current===null)return;$('#status').textContent='Resolved';const done=current;setTimeout(()=>{active=active.filter(i=>i!==done);reset();render()},900)}function customerReply(text){const c=clients[current],low=text.toLowerCase(),arr=replies[c[3]]||replies.Account;const canResolve=msgCount>=9&&resolution[c[3]].some(k=>low.includes(k));setTimeout(()=>{if(current===null)return;add('customer',canResolve?'Thank you, that resolves my issue. I appreciate your help.':arr[Math.floor(Math.random()*arr.length)]);if(canResolve)setTimeout(finish,700)},650)}$('#form').onsubmit=e=>{e.preventDefault();if(current===null)return;const input=$('#input'),text=input.value.trim();if(!text)return;add('agent',text);input.value='';if(msgCount>=18){setTimeout(()=>{add('customer','Thank you. I have everything I need now. The issue is resolved.');setTimeout(finish,700)},650)}else customerReply(text)};$('#new').onclick=()=>{const available=clients.map((_,i)=>i).filter(i=>!active.includes(i));if(!available.length){alert('No new customer requests available.');return}const i=available[Math.floor(Math.random()*available.length)];active.push(i);open(i)};$('#search').oninput=render;const maps={Billing:['Identify transaction','Check billing history','Confirm issue','Apply billing policy','Resolve and confirm'],Technical:['Identify environment','Check incident','Collect diagnostics','Apply fix or escalate','Confirm restoration'],Account:['Verify account','Identify change','Check permissions','Apply policy','Confirm update'],Access:['Verify identity','Check access','Secure recovery','Confirm login'],Subscription:['Check plan','Review terms','Apply requested action','Confirm effective date'],Booking:['Verify reservation','Check policy','Update booking','Confirm details'],Delivery:['Check tracking','Review carrier','Confirm delivery action'],Order:['Verify order','Check fulfillment','Resolve request','Confirm outcome'],Returns:['Verify eligibility','Apply return policy','Issue instructions','Confirm next step'],Payments:['Check transaction','Review authorization','Resolve or escalate','Confirm outcome'],Product:['Identify product','Check knowledge','Provide verified information','Confirm need']};$('#mapBtn').onclick=()=>{if(current===null)return;const c=clients[current],steps=maps[c[3]]||maps.Account;$('#mapTitle').textContent=c[3]+' · Resolution map';$('#map').innerHTML=steps.map((x,n)=>'<div class="node"><b>'+String(n+1).padStart(2,'0')+'</b> · '+x+'</div>').join('');$('#modal').classList.add('show')};$('#close').onclick=()=>$('#modal').classList.remove('show');render();</script></body></html>
