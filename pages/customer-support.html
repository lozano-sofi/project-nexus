<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Support Training</title><style>body{margin:0;background:#f5f6f8;color:#181a1f;font:14px Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:220px 300px 1fr 270px;height:100vh}.side{background:#17181c;color:#fff;padding:22px}.brand{font-weight:800;font-size:16px;margin-bottom:35px}.nav{color:#aaa;line-height:2.8}.nav b{display:block;background:#292b32;color:#fff;border-radius:8px;padding:0 10px}.inbox,.details,.chat{background:#fff}.inbox{border-right:1px solid #e5e6e9}.head{padding:22px;border-bottom:1px solid #eee}.head h2{margin:0 0 8px}.scenario{padding:15px 20px;border-bottom:1px solid #eee;cursor:pointer}.scenario.active{background:#f5f2ff;border-left:3px solid #6658ef}.muted{color:#777;font-size:12px}.chat{display:flex;flex-direction:column;background:#fafafa}.chathead{background:#fff;padding:18px 24px;border-bottom:1px solid #eee}.messages{flex:1;overflow:auto;padding:28px 9%}.msg{max-width:70%;margin:12px 0}.msg.customer{margin-right:auto}.msg.agent{margin-left:auto;text-align:right}.bubble{display:inline-block;padding:12px 15px;border-radius:13px;background:#fff;border:1px solid #e5e5e8;text-align:left;line-height:1.45}.agent .bubble{background:#6658ef;color:#fff;border-color:#6658ef}.composer{padding:15px 24px;background:#fff;border-top:1px solid #eee;display:flex;gap:8px}.composer input{flex:1;border:1px solid #ddd;border-radius:9px;padding:11px}.composer button,.start{border:0;background:#6658ef;color:#fff;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.details{border-left:1px solid #e5e6e9;padding:22px}.card{background:#f7f7f8;border-radius:10px;padding:14px;margin:10px 0}.score{font-size:30px;font-weight:800}.status{color:#228557}.start{width:100%;margin-top:8px}@media(max-width:900px){.app{grid-template-columns:70px 260px 1fr}.details{display:none}.side{padding:20px 8px}.brand{font-size:0}.nav{font-size:0}}@media(max-width:650px){.app{grid-template-columns:1fr}.side,.inbox{display:none}.messages{padding:20px}.msg{max-width:88%}}</style></head><body><div class="app"><aside class="side"><div class="brand">NEXUS SUPPORT</div><div class="nav"><b>▣ Training Inbox</b><div>◫ Tickets</div><div>♙ Customers</div><div>◴ Analytics</div></div></aside><section class="inbox"><div class="head"><h2>Training</h2><div class="muted">Choose a simulated European customer</div></div><div id="scenarios"></div></section><main class="chat"><header class="chathead"><b id="name">Elena Rossi</b><div class="muted" id="issue">Billing · High priority</div></header><div class="messages" id="messages"></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Reply to the customer..."><button>Send</button></form></main><aside class="details"><h3>Training Session</h3><div class="card"><div class="muted">Ticket</div><b id="ticket">NX-2048</b></div><div class="card"><div class="muted">Status</div><b class="status" id="status">OPEN</b></div><div class="card"><div class="muted">Category</div><b id="category">Billing</b></div><div class="card"><div class="muted">Customer</div><b id="customer">Elena Rossi</b><p class="muted" id="email">elena.rossi@example.com</p></div><div class="card"><div class="muted">Score</div><div class="score" id="score">—</div><div class="muted">Resolve the issue to finish.</div></div><button class="start" id="new">New Scenario</button></aside></div><script>const scenarios=[{name:'Elena Rossi',email:'elena.rossi@example.com',issue:'Billing · High priority',ticket:'NX-2048',category:'Billing',opening:'Hello, I was charged twice for my subscription this month. Could you please check what happened?',keywords:['refund','duplicate','charged','charge','billing'],success:'Thank you. I can see the duplicate charge has been addressed. I appreciate your help.'},{name:'Arthur Bennett',email:'arthur.bennett@example.com',issue:'Account · Medium priority',ticket:'NX-2049',category:'Account',opening:'Hi, I need to change the company address on our account. Where can I do that?',keywords:['address','profile','settings','account'],success:'Perfect, I found the company profile settings. Thanks for guiding me.'},{name:'Sophie Laurent',email:'sophie.laurent@example.com',issue:'Technical · High priority',ticket:'NX-2050',category:'Technical',opening:'Our CSV export keeps timing out. We need the report for a client today.',keywords:['export','timeout','technical','bug','escalate'],success:'That makes sense. Thanks for escalating this and explaining what will happen next.'},{name:'Matteo Bianchi',email:'matteo.bianchi@example.com',issue:'Access · Medium priority',ticket:'NX-2051',category:'Access',opening:'I cannot sign in because I forgot my password. Can you help me regain access?',keywords:['password','reset','login','sign in','access'],success:'I received the reset instructions. I am back in. Thank you!'},{name:'Charlotte Müller',email:'charlotte.muller@example.com',issue:'Cancellation · High priority',ticket:'NX-2052',category:'Subscription',opening:'I would like to cancel our subscription. Please tell me what happens next.',keywords:['cancel','cancellation','subscription','close'],success:'Understood. Thank you for explaining the cancellation process clearly.'}];let current=0,resolved=false;const $=x=>document.querySelector(x);function renderScenarios(){scenarios.forEach((s,i)=>{let d=document.createElement('div');d.className='scenario '+(i===0?'active':'');d.innerHTML='<b>'+s.name+'</b><div class="muted">'+s.issue+'</div>';d.onclick=()=>load(i);$('#scenarios').appendChild(d)})}function load(i){current=i;resolved=false;document.querySelectorAll('.scenario').forEach((x,j)=>x.classList.toggle('active',j===i));let s=scenarios[i];$('#name').textContent=s.name;$('#issue').textContent=s.issue;$('#ticket').textContent=s.ticket;$('#category').textContent=s.category;$('#customer').textContent=s.name;$('#email').textContent=s.email;$('#status').textContent='OPEN';$('#score').textContent='—';$('#messages').innerHTML='';add('customer',s.opening)}function add(who,text){let d=document.createElement('div');d.className='msg '+who;d.innerHTML='<div class="bubble">'+escapeHtml(text)+'</div>';$('#messages').appendChild(d);$('#messages').scrollTop=$('#messages').scrollHeight}function escapeHtml(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function autoReply(text){let s=scenarios[current],t=text.toLowerCase();if(s.keywords.some(k=>t.includes(k))&&!resolved){resolved=true;$('#status').textContent='RESOLVED';$('#score').textContent='94/100';setTimeout(()=>add('customer',s.success),700);return}setTimeout(()=>add('customer',t.length<12?'Could you please give me a little more detail? I want to make sure I understand the issue correctly.':'Thanks for looking into this. What would be the next step from here?'),700)}$('#form').onsubmit=e=>{e.preventDefault();let x=$('#input'),t=x.value.trim();if(!t)return;add('agent',t);x.value='';autoReply(t)};$('#new').onclick=()=>load(Math.floor(Math.random()*scenarios.length));renderScenarios();load(0);</script></body></html>
